spring:
  application:
    name: spring-gift

jwt:
  secret: ${JWT_SECRET:a-string-secret-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:3600000}

kakao:
  login:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com
